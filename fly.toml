# Fly.io deployment. One always-on machine (no cold starts) with a persistent volume
# for the SQLite database and stored label images.
#
#   fly launch --copy-config --no-deploy
#   fly volumes create labelverify_data --size 1
#   fly secrets set ANTHROPIC_API_KEY=... SECRET_KEY=$(openssl rand -hex 32)
#   fly deploy

app = "labelverify"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/labelverify.db"

[[mounts]]
  source = "labelverify_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"
