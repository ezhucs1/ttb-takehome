[project]
name = "labelverify"
version = "0.1.0"
description = "AI-assisted alcohol label verification prototype for TTB COLA review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9.0",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "httpx>=0.27",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labelverify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long prose strings in reasons and prompts are intentional

[tool.ruff.lint.per-file-ignores]
"labelverify/web/**" = ["B008"]  # FastAPI Depends()/File()/Form() defaults are the framework idiom
