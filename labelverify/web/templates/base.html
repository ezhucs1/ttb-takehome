<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LabelVerify{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark">TTB</span>
        <span>LabelVerify</span>
      </a>
      <span class="mode-pill" title="Which extractor reads the label">{{ extractor_label }}</span>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap footer">
    Prototype for the TTB label verification take-home. The tool recommends; a labeling specialist decides.
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
