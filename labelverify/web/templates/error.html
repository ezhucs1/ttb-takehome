{% extends "layout.html" %}
{% block title %}{{ status }}{% endblock %}
{% block content %}
<div class="page-header"><div><h1>{{ 'Not found' if status == 404 else 'Something went wrong' }}</h1></div></div>
<div class="card"><p>{{ message }}</p><p><a class="btn btn-secondary" href="/">Back to start</a></p></div>
{% endblock %}
{% block auth %}
<div class="auth-panel"><h1>{{ status }}</h1><p>{{ message }}</p><a class="btn btn-primary" href="/login">Sign in</a></div>
{% endblock %}
